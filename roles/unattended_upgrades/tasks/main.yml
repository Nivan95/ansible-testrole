---
# SPDX-License-Identifier: MIT-0
- name: Install Security Updates
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  become: true

- name: Template
  ansible.builtin.template:
    src: 52periodic-reboot.j2
    dest: /etc/apt/apt.conf.d/52periodic-reboot
    mode: "0644"
  become: true

- name: Auto-Upgrades
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
  become: true
